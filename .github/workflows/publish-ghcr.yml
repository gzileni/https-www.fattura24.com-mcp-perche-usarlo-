name: Publish multi-platform Docker image to GHCR
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '*.py'
      - 'scripts/smoke_test.py'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR using the built-in GitHub token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gzileni/fattura24-mcp-bridge
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Fattura24 MCP Bridge
            org.opencontainers.image.description=Unofficial self-hosted MCP bridge for Fattura24
            org.opencontainers.image.source=https://github.com/gzileni/https-www.fattura24.com-mcp-perche-usarlo-
            org.opencontainers.image.licenses=MIT
      - name: Validate candidate image before publishing (no provider network)
        run: |
          docker build -t fattura24-candidate .
          docker run -d --name fattura24-candidate --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e BRIDGE_TOKEN=ci-demo-only -e FATTURA24_ENABLE_WRITES=false fattura24-candidate
          docker exec fattura24-candidate python -m pip check
          docker exec fattura24-candidate python /app/smoke_test.py
          docker rm -f fattura24-candidate
      - name: Build and push linux/amd64 and linux/arm64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Verify image is available in GHCR
        run: |
          docker buildx imagetools inspect ghcr.io/gzileni/fattura24-mcp-bridge:latest
          docker pull --platform linux/amd64 ghcr.io/gzileni/fattura24-mcp-bridge@${{ steps.build.outputs.digest }}
      - name: Run a no-write MCP integration test from the PUBLISHED image
        run: |
          docker run -d --name fattura24-published --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e BRIDGE_TOKEN=ci-demo-only -e FATTURA24_ENABLE_WRITES=false ghcr.io/gzileni/fattura24-mcp-bridge@${{ steps.build.outputs.digest }}
          docker exec fattura24-published python -m pip check
          docker exec fattura24-published python /app/smoke_test.py
          docker inspect --format 'Image={{.Image}} User={{.Config.User}} Health={{.State.Health.Status}}' fattura24-published
      - name: Validate standalone Linux launcher and idempotent reuse
        run: |
          bash scripts/launch-standalone.sh
          before=$(docker inspect -f '{{.Id}}' fattura24-mcp)
          bash scripts/launch-standalone.sh
          test "$before" = "$(docker inspect -f '{{.Id}}' fattura24-mcp)"
      - name: Cleanup local test
        if: always()
        run: |
          docker logs --tail=100 fattura24-candidate || true
          docker logs --tail=100 fattura24-published || true
          docker rm -f fattura24-candidate fattura24-published fattura24-mcp || true
