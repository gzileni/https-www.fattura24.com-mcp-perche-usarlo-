name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q core.py server.py fattura24_client.py fattura24_extra.py scripts/smoke_test.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fattura24-preview:ci .
  mcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avvia container senza credenziali Fattura24
        run: |
          printf "BRIDGE_TOKEN=%s\nFATTURA24_ENABLE_WRITES=false\n" "$(openssl rand -hex 32)" > .env
          docker compose up -d --build
      - name: Test HTTP, autenticazione e strumenti MCP, senza scritture
        run: python scripts/smoke_test.py
      - name: Log e stop (anche dopo errori)
        if: always()
        run: |
          docker compose logs --tail=100 || true
          docker compose down -v || true
          rm -f .env
