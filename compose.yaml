# Remote image from GitHub Container Registry; no local build required.
# Change FATTURA24_IMAGE in your private .env if you want a pinned release.
services:
  bridge:
    image: ${FATTURA24_IMAGE:-ghcr.io/gzileni/fattura24-mcp-bridge:latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - fattura24_state:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  fattura24_state:
